<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Vorela · 舞台输出</title>
    <link rel="icon" type="image/svg+xml" href="/mark.svg?v=2" />
    <style>
      :root {
        --sans: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue",
          sans-serif;
        --mono: "SF Mono", ui-monospace, Menlo, monospace;
        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #picture {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000000;
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      body.no-token {
        background: #f5f5f7;
      }
      #picture video {
        object-fit: contain !important;
      }
      #sub {
        position: absolute;
        left: 50%;
        bottom: 6.5%;
        transform: translateX(-50%);
        max-width: min(88%, 1080px);
        padding: 0.36em 0.72em;
        border-radius: 14px;
        background: rgba(17, 17, 19, 0.72);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        text-align: center;
        color: #ffffff;
        font: 600 clamp(18px, 3.2vmin, 54px) / 1.4 var(--sans);
        letter-spacing: -0.015em;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        text-wrap: balance;
      }
      #sub:empty {
        display: none;
      }
      #resume {
        position: absolute;
        z-index: 20;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: #ffffff;
        color: #111113;
        border: 1px solid rgba(17, 17, 19, 0.1);
        padding: 13px 22px;
        border-radius: 9999px;
        font: 600 14.5px/1.2 var(--sans);
        letter-spacing: -0.01em;
        cursor: pointer;
        box-shadow:
          0 2px 6px rgba(0, 0, 0, 0.2),
          0 16px 36px -8px rgba(0, 0, 0, 0.5);
        transition:
          background-color 150ms var(--ease),
          transform 120ms var(--ease);
      }
      #resume:hover {
        background: #f4f4f6;
        transform: translate(-50%, calc(-50% - 1px));
      }
      #resume:active {
        transform: translate(-50%, -50%) scale(0.98);
      }
      #resume:focus-visible {
        outline: 2px solid #ffffff;
        outline-offset: 3px;
      }
      #resume svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #stageNotice {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f5f5f7;
      }
      .stage-card {
        width: min(440px, 100%);
        background: #ffffff;
        border: 1px solid #e4e4ea;
        border-radius: 24px;
        padding: 32px 30px;
        box-shadow: 0 1px 2px rgba(17, 17, 19, 0.03), 0 16px 36px -18px rgba(17, 17, 19, 0.08);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .stage-card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .stage-card-head img {
        width: 34px;
        height: 34px;
        border-radius: 9px;
      }
      .stage-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 9999px;
        background: #ffffff;
        border: 1px solid #e4e4ea;
        font: 600 10.5px/1.2 var(--mono);
        letter-spacing: 0.05em;
        color: #27272a;
      }
      .stage-pill i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #f59e0b;
      }
      .stage-card h1 {
        margin: 4px 0 0;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.025em;
        color: #111113;
      }
      .stage-card p {
        margin: 0;
        font-size: 13.5px;
        line-height: 1.6;
        color: #63666e;
      }
      #occupiedNotice {
        position: fixed;
        inset: 0;
        z-index: 15;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(17, 17, 19, 0.86);
      }
      .takeover-btn {
        align-self: flex-start;
        margin-top: 4px;
        border: 0;
        background: #111113;
        color: #ffffff;
        border-radius: 9999px;
        padding: 10px 18px;
        font: 600 13.5px/1.2 var(--sans);
        cursor: pointer;
      }
      .takeover-btn:hover {
        background: #27272a;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="picture"></div>
    <div id="sub"></div>
    <audio id="songAudio" preload="auto" playsinline></audio>
    <audio id="bgmAudio" preload="auto" playsinline></audio>
    <button id="resume" hidden>
      <svg viewBox="0 0 18 18" aria-hidden="true">
        <path d="M3.5 7h2.7l3.6-2.8v9.6L6.2 11H3.5a.9.9 0 0 1-.9-.9V7.9a.9.9 0 0 1 .9-.9Z" />
        <path d="M12.6 6.4a3.7 3.7 0 0 1 0 5.2M14.6 4.5a6.2 6.2 0 0 1 0 9" />
      </svg>
      <span>允许播放声音</span>
    </button>
    <div id="occupiedNotice" hidden>
      <div class="stage-card">
        <div class="stage-card-head">
          <img src="/mark.svg" alt="Vorela" />
          <span class="stage-pill"><i aria-hidden="true"></i>舞台已被占用</span>
        </div>
        <h1>另一窗口或 OBS 正在输出舞台</h1>
        <p>画面和 BGM 正在占用端播放。若正在用 OBS，请关闭本页并在 OBS 混音器 → 高级音频属性将数字人设为「监听并输出」；或点击下方按钮把舞台切换到当前窗口收听。</p>
        <button id="takeoverStage" type="button" class="takeover-btn">切换舞台输出到此窗口</button>
      </div>
    </div>
    <div id="stageNotice" hidden>
      <div class="stage-card">
        <div class="stage-card-head">
          <img src="/mark.svg" alt="Vorela" />
          <span class="stage-pill"><i aria-hidden="true"></i>等待授权</span>
        </div>
        <h1>需要舞台访问令牌</h1>
        <p>请从 Vorela 直播控制台点击「打开舞台」，或使用「复制 OBS 地址」将专用链接添加为 OBS 浏览器源。</p>
      </div>
    </div>
    <script type="module" src="/stage.js"></script>
  </body>
</html>
