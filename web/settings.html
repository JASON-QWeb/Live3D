      <section id="config" aria-labelledby="config-title" hidden>
        <div class="heading">
          <div class="heading-copy">
            <h1 id="config-title">直播设置</h1>
          </div>
          <div class="actions">
            <button id="save" class="primary">
              <svg class="ic" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M3.2 8.4l3.1 3.1 6.5-6.8" />
              </svg>
              <span>保存设置</span>
            </button>
          </div>
        </div>

        <form id="settings" class="bento-sheet settings-bento" autocomplete="off">
          <div class="panel-column">
            <section class="bento-cell cell-avatar" aria-labelledby="h-avatar">
              <div class="cell-top">
                <h2 id="h-avatar">角色与画面</h2>
                <span id="imageStatus" class="status-chip">尚未上传角色图</span>
              </div>

              <div class="fields">
                <div class="field-upload">
                  <label for="image">角色图（PNG / JPEG / WebP，上限 8 MiB）</label>
                  <img id="avatarPreview" alt="已保存角色图" hidden />
                  <div class="upload-row">
                    <input id="image" type="file" accept="image/png,image/jpeg,image/webp" />
                    <button type="button" class="text-button text-danger" id="deleteImage" hidden>移除角色图</button>
                  </div>
                </div>

                <div class="pair">
                  <label>
                    <span>Vidu 形象 ID</span>
                    <input name="avatar_id" placeholder="已创建形象时填写，优先于角色图" />
                  </label>
                  <label>
                    <span>动作库 ID</span>
                    <input name="action_library" placeholder="留空使用平台默认库" />
                  </label>
                </div>

                <div class="pair">
                  <label>
                    <span>分辨率</span>
                    <select name="resolution">
                      <option>720p</option>
                      <option>1080p</option>
                      <option>2k</option>
                    </select>
                  </label>
                  <label>
                    <span>连线时限（分钟）</span>
                    <input type="number" name="max_minutes" min="1" max="1440" required />
                  </label>
                </div>

                <div class="toggle-group">
                  <label class="check">
                    <input name="recording" type="checkbox" />
                    <span>请求云端录播</span>
                  </label>
                </div>

                <div id="viduKey"></div>
                <div class="row wrap-row">
                  <button id="checkVidu" type="button">核对 Vidu 余额</button>
                  <span class="meta" id="balance"></span>
                </div>
              </div>
            </section>
            <section class="bento-cell cell-interact" aria-labelledby="h-interact">
              <div class="cell-top">
                <h2 id="h-interact">互动、自动播报与弹幕</h2>
              </div>

              <div class="fields">
                <div class="pair">
                  <label>
                    <span>直播平台</span>
                    <select name="live_platform" id="livePlatform" required>
                      <option value="" disabled>请选择直播平台</option>
                      <option value="douyin">抖音</option>
                      <option value="youtube">YouTube</option>
                      <option value="other">TikTok / 其他平台（外部工具接入）</option>
                    </select>
                  </label>
                  <label>
                    <span>收到普通弹幕后</span>
                    <select name="audience_mode">
                      <option value="review">仅显示，由主播处理</option>
                      <option value="read">自动朗读</option>
                      <option value="reply">自动生成回复</option>
                    </select>
                  </label>
                </div>
                <label data-platform="douyin" hidden>
                  <span>抖音直播间号</span>
                  <input name="douyin_room" maxlength="200" spellcheck="false" placeholder="直播间号或 live.douyin.com 链接" />
                </label>
                <div class="service-banner" id="douyinState" data-platform="douyin" hidden></div>
                <details class="sub-disclosure" data-platform="douyin" hidden>
                  <summary>高级：改用外部 douyinLive</summary>
                  <div class="sub-fields">
                    <p class="meta">默认由 Vorela 直接连接直播间。只有内置连接失效、要临时换回外部 douyinLive 时才填程序路径，清空即恢复内置连接。</p>
                    <label>
                      <span>douyinLive 程序路径</span>
                      <input name="douyin_program" spellcheck="false" autocomplete="off" placeholder="例如 /Users/你的用户名/douyinLive/douyinLive" />
                    </label>
                    <label>
                      <span>douyinLive 端口</span>
                      <input name="douyin_port" type="number" min="1" max="65535" required />
                    </label>
                  </div>
                </details>
                <label data-platform="youtube" hidden>
                  <span>YouTube 直播视频 ID</span>
                  <input name="youtube_video" maxlength="11" placeholder="11 位视频 ID" />
                </label>
                <p class="meta" data-platform="other" hidden>
                  在「环境配置」复制弹幕接入信息，将地址和令牌填入采集工具。
                </p>
                <label>
                  <span>话术档案</span>
                  <input name="prompt_profile" maxlength="64" pattern="[A-Za-z0-9_\-]+" required />
                </label>
                <details class="sub-disclosure">
                  <summary>编辑话术</summary>
                  <div class="sub-fields">
                    <div id="promptSource" class="prompt-source mono" role="status"></div>
                    <label class="lang-zh">
                      <span>中文话术 JSON</span>
                      <textarea id="prompt-zh" class="mono" rows="12" spellcheck="false" disabled></textarea>
                    </label>
                    <label class="lang-en" hidden>
                      <span>English speech profile JSON</span>
                      <textarea id="prompt-en" class="mono" rows="12" spellcheck="false" disabled></textarea>
                    </label>
                    <div class="pair">
                      <button type="button" id="reloadPrompt">重新读取</button>
                      <button type="button" id="savePrompt" disabled>保存话术</button>
                    </div>
                  </div>
                </details>
                <div class="toggle-group">
                  <label class="check">
                    <input type="checkbox" name="auto_welcome" />
                    <span>不唱歌时定时欢迎</span>
                  </label>
                  <label class="check">
                    <input type="checkbox" name="welcome_joins" />
                    <span>进房偶尔欢迎（中文跳过英文名）</span>
                  </label>
                  <label class="check">
                    <input type="checkbox" name="auto_thank_gifts" />
                    <span>自动 AI 谢礼（唱歌时唱完统一谢）</span>
                  </label>
                  <label class="check">
                    <input type="checkbox" name="auto_sing" />
                    <span>定时自动唱歌</span>
                  </label>
                  <label class="check">
                    <input type="checkbox" name="song_requests" />
                    <span>接受弹幕「点歌 曲名」</span>
                  </label>
                </div>

                <div class="pair">
                  <label>
                    <span>行为间最小间隔（秒）</span>
                    <input type="number" name="utterance_gap" min="1" max="60" required />
                  </label>
                  <label>
                    <span>定时欢迎间隔（秒）</span>
                    <input type="number" name="ambient_welcome_gap" min="10" max="600" required />
                  </label>
                </div>
                <div class="pair">
                  <label>
                    <span>进房欢迎冷却（秒）</span>
                    <input type="number" name="join_welcome_gap" min="5" max="300" required />
                  </label>
                  <label>
                    <span>定时唱歌间隔（秒）</span>
                    <input type="number" name="auto_sing_gap" min="15" max="3600" required />
                  </label>
                </div>
                <div class="pair">
                  <label>
                    <span>演唱出声方式</span>
                    <select name="song_audio_mode">
                      <option value="stage">舞台高音质原声（Vidu 驱动作 + 本地直出）</option>
                      <option value="vidu">Vidu 原声直推（24kHz 单声道，免调偏移）</option>
                    </select>
                  </label>
                  <label>
                    <span>说话时 BGM 压低比例（%）</span>
                    <input type="number" name="bgm_duck_percent" min="0" max="100" required />
                  </label>
                </div>
                <div class="pair">
                  <label>
                    <span>演唱音画同步偏移（毫秒）</span>
                    <input type="number" name="song_sync_offset_ms" min="0" max="4000" step="50" required />
                  </label>
                  <label>
                    <span>演唱音量（%）</span>
                    <input type="number" name="song_volume" min="0" max="100" required />
                  </label>
                </div>

                <details class="sub-disclosure">
                  <summary>唱歌神态</summary>
                  <div class="sub-fields">
                    <label class="lang-zh">
                      <span>唱歌神态自然引导（留空则完全由 Vidu 自由发挥）</span>
                      <input name="singing_action" placeholder="例如：自然投入地唱歌，神情柔和灵动，随旋律轻轻晃动" />
                    </label>
                    <label class="lang-en" hidden>
                      <span>Singing demeanor guide (leave blank for Vidu auto)</span>
                      <input name="singing_action_en" />
                    </label>
                    <label class="lang-zh">
                      <span>唱完后神态衔接（留空则自然衔接）</span>
                      <input name="post_sing_action" placeholder="例如：唱完歌微笑看向镜头，神态温柔放松" />
                    </label>
                    <label class="lang-en" hidden>
                      <span>Post-song demeanor transition</span>
                      <input name="post_sing_action_en" />
                    </label>
                  </div>
                </details>
              </div>
            </section>
          </div>
          <div class="panel-column">
            <section class="bento-cell" aria-labelledby="h-local">
              <div class="cell-top"><h2 id="h-local">本机服务</h2></div>
              <div class="service-launchers">
                <div>
                  <button type="button" id="startModel" class="btn-chip">启动本机对话</button>
                  <div class="service-banner" id="modelState"></div>
                  <div class="service-progress" id="modelProgress" hidden>
                    <div class="service-progress-row">
                      <span id="modelProgressStep"></span>
                      <span class="mono" id="modelProgressValue"></span>
                    </div>
                    <div class="meter" role="progressbar" aria-labelledby="modelProgressStep"><span></span></div>
                  </div>
                </div>
                <div>
                  <button type="button" id="startVoice" class="btn-chip">启动本机 MLX</button>
                  <div class="service-banner" id="voiceState"></div>
                  <div class="service-progress" id="voiceProgress" hidden>
                    <div class="service-progress-row">
                      <span id="voiceProgressStep"></span>
                      <span class="mono" id="voiceProgressValue"></span>
                    </div>
                    <div class="meter" role="progressbar" aria-labelledby="voiceProgressStep"><span></span></div>
                  </div>
                </div>
              </div>
              <div class="fields model-fields">
                <div class="pair">
                  <label>
                    <span>语言模型接口</span>
                    <input name="llm_endpoint" type="url" placeholder="完整的 chat/completions 地址" />
                  </label>
                  <label>
                    <span>语言模型名称</span>
                    <input name="llm_model" />
                  </label>
                </div>
              </div>
            </section>
            <section class="bento-cell cell-voice" aria-labelledby="h-voice">
              <div class="cell-top">
                <h2 id="h-voice">语音设置</h2>
              </div>

              <div class="fields">
                <label>
                  <span>直播语言</span>
                  <select name="live_language" id="liveLanguage">
                    <option value="zh">中文直播（仅启用中文 TTS · 灵小柔）</option>
                    <option value="en">英文直播（仅启用英文 TTS · Willow）</option>
                  </select>
                </label>
                <label>
                  <span>语音来源</span>
                  <select name="tts_mode">
                    <option value="mlx">MLX / 兼容语音服务</option>
                    <option value="system">macOS 系统语音（本机试听）</option>
                  </select>
                </label>
                <label>
                  <span>语音接口</span>
                  <input name="tts_endpoint" type="url" />
                </label>
                <label class="lang-zh">
                  <span>中文模型</span>
                  <input name="tts_model" />
                </label>
                <label class="lang-zh">
                  <span>中文音色</span>
                  <input name="voice" />
                </label>
                <label class="lang-en" hidden>
                  <span>英文模型</span>
                  <input name="tts_model_en" />
                </label>
                <label class="lang-en" hidden>
                  <span>英文音色</span>
                  <input name="voice_en" />
                </label>
                <details class="sub-disclosure">
                  <summary>兼容服务参考音色</summary>
                  <div class="sub-fields">
                    <label>
                      <span>录音在语音服务上的路径</span>
                      <input name="reference_audio" />
                    </label>
                    <label>
                      <span>录音逐字稿</span>
                      <textarea name="reference_text" rows="2"></textarea>
                    </label>
                  </div>
                </details>
              </div>
            </section>
          </div>
          <div class="panel-column">
            <section class="bento-cell cell-keys" aria-labelledby="h-keys">
              <div class="cell-top">
                <h2 id="h-keys">环境配置</h2>
                <span class="audit-pill"><i aria-hidden="true"></i>本地 .env</span>
              </div>

              <div class="fields" id="keys"></div>

              <div class="cred-actions">
                <button id="copyIngest" type="button" class="btn-full-subtle">复制弹幕接入信息</button>
              </div>
            </section>
            <section class="bento-cell cell-obs" aria-labelledby="h-obs">
              <div class="cell-top">
                <h2 id="h-obs">OBS 推流配置</h2>
              </div>

              <div class="fields">
                <div class="pair">
                  <label>
                    <span>本机 WebSocket 端口</span>
                    <input id="obsPort" name="obs_port" type="number" min="1" max="65535" value="4455" required />
                  </label>
                  <label>
                    <span>OBS WebSocket 密码</span>
                    <input id="obsPass" type="password" autocomplete="new-password" placeholder="未设密码可留空" />
                  </label>
                </div>
                <div class="row wrap-row">
                  <button id="openObs" type="button">打开 OBS</button>
                  <button id="setupObs" type="button">建立 Vorela 场景</button>
                  <span class="meta" id="obsStatus"></span>
                </div>
                <p class="meta obs-missing" id="obsMissing" hidden>
                  这台 Mac 上没有找到 OBS Studio。<a href="https://obsproject.com/download" target="_blank" rel="noopener noreferrer">下载 OBS</a>，装好后再点「打开 OBS」。
                </p>
                <label>
                  <span>推流地址（服务器）</span>
                  <input id="streamServer" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="rtmp://… 直播平台给的服务器地址" />
                </label>
                <label>
                  <span>推流码（串流密钥）</span>
                  <input id="streamKey" type="password" autocomplete="new-password" spellcheck="false" placeholder="直播平台给的推流码" />
                </label>
                <div class="row wrap-row">
                  <button id="saveStream" type="button">保存到 OBS</button>
                  <button id="obsLive" type="button" class="primary" disabled>开始直播</button>
                </div>
                <div class="service-banner" id="streamState"></div>
              </div>

            </section>
          </div>
        </form>

        <div class="settings-foot">
          <div class="data-dir">
            <svg class="ic" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M2.2 4.5A1.3 1.3 0 0 1 3.5 3.2h2.7l1.3 1.4h5a1.3 1.3 0 0 1 1.3 1.3v5.6a1.3 1.3 0 0 1-1.3 1.3h-9a1.3 1.3 0 0 1-1.3-1.3V4.5Z" />
            </svg>
            <span id="dataPath" class="mono"></span>
          </div>
          <button id="quit" class="btn-quit">退出 Vorela</button>
        </div>
      </section>
