<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="description" content="Vorela 本机角色互动直播控制台：实时监看画面、播音调度、弹幕互动与 OBS 场景集成。" />
    <title>Vorela · 直播控制台</title>
    <link rel="icon" type="image/png" href="/mark.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="top">
      <div class="top-inner">
        <div class="brand">
          <img src="/mark.png" alt="" width="30" height="30" />
          <div class="brand-text">
            <strong>Vorela</strong>
          </div>
        </div>
        <nav class="nav-track" aria-label="主导航">
          <button class="tab active" data-tab="desk" aria-current="page">直播台</button>
          <button class="tab" data-tab="config">设置</button>
        </nav>
        <div class="top-end">
          <button type="button" id="uiLang" class="ui-lang" aria-label="切换界面语言" title="切换界面语言">English</button>
          <div class="top-state" role="status" aria-live="polite">
            <span class="lang-chip" id="langChip">中文直播</span>
            <i id="lamp" aria-hidden="true"></i>
            <span id="phase">连接本机中</span>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section id="desk" aria-labelledby="desk-title">
        <div class="heading">
          <div class="heading-copy">
            <h1 id="desk-title">直播控制台</h1>
          </div>
          <div class="actions">
            <button id="copyStage" class="btn-pill-secondary">
              <svg class="ic" viewBox="0 0 16 16" aria-hidden="true">
                <rect x="5.5" y="5.5" width="7.5" height="7.5" rx="1.8" />
                <path d="M10.5 5.5V4.2A1.7 1.7 0 0 0 8.8 2.5H4.2A1.7 1.7 0 0 0 2.5 4.2v4.6a1.7 1.7 0 0 0 1.7 1.7h1.3" />
              </svg>
              <span>复制 OBS 地址</span>
            </button>
            <button id="start" class="primary">
              <span class="btn-dot" aria-hidden="true"></span>
              <span>开始连线</span>
            </button>
            <button id="stop" class="danger" hidden>
              <span class="btn-stop-sq" aria-hidden="true"></span>
              <span>结束连线</span>
            </button>
          </div>
        </div>

        <div class="bento-sheet desk-bento">
          <div class="panel-column">
            <section class="bento-cell cell-monitor" aria-labelledby="h-monitor">
              <div class="cell-top">
                <h2 id="h-monitor">播出监看</h2>
                <span class="status-chip" id="previewType">未连接</span>
              </div>

              <div class="screen" id="screenBox">
                <div class="guides" aria-hidden="true"></div>
                <img id="poster" alt="角色监看" hidden />
                <div class="empty" id="screenEmpty">
                  <b id="emptyTitle">等待角色画面</b>
                  <button id="chooseRole" class="pill-mini-dark">配置角色图</button>
                </div>
              </div>

              <div class="monitor-foot">
                <span class="stage-indicator">
                  <i class="stage-dot" id="stageDot" aria-hidden="true"></i>
                  <span id="outputState">舞台未打开</span>
                </span>
                <button id="openStage" class="text-button">
                  <span>打开舞台</span>
                  <svg class="ic-arrow" viewBox="0 0 14 14" aria-hidden="true">
                    <path d="M4 10L10 4M5.2 4H10v4.8" />
                  </svg>
                </button>
              </div>
            </section>
            <section class="bento-cell cell-session" aria-labelledby="h-session">
              <div class="cell-top">
                <h2 id="h-session">会话</h2>
                <span class="clock-pill mono" id="clock">00:00:00</span>
              </div>

              <dl class="facts">
                <div>
                  <dt>云端状态</dt>
                  <dd id="message">—</dd>
                </div>
                <div>
                  <dt>输出画面</dt>
                  <dd id="dimensions">—</dd>
                </div>
                <div>
                  <dt>等待播出</dt>
                  <dd id="pending">—</dd>
                </div>
                <div>
                  <dt>首段音频等待时间</dt>
                  <dd id="latency">—</dd>
                </div>
                <div>
                  <dt>云端结算</dt>
                  <dd id="bill">—</dd>
                </div>
              </dl>

              <div class="panel-extra callout-warn" id="recovery" hidden>
                <button id="recover" class="primary">核对云端并结束</button>
                <button class="text-button" id="ack">已在 Vidu 控制台确认结束</button>
              </div>
              <div class="panel-extra callout-subtle" id="recordRow" hidden>
                <button id="record">查询云端录播</button>
                <span id="recordLinks" class="record-links"></span>
              </div>

              <div class="signal-strip" id="signalStrip" aria-hidden="true">
                <div class="signal-eq">
                  <span></span><span></span><span></span><span></span><span></span>
                </div>
                <span class="signal-caption mono" id="signalCaption">待机 · 本机就绪</span>
              </div>
            </section>
            <section class="bento-cell cell-events" aria-labelledby="h-events">
              <div class="cell-top">
                <h2 id="h-events">直播动态</h2>
                <div class="row event-top-actions">
                  <span class="status-chip mono" id="eventCount"></span>
                  <button type="button" id="clearEvents" class="btn-chip" hidden>清空动态</button>
                </div>
              </div>

              <div id="events" class="event-list">
                <div class="empty-events">暂无直播事件</div>
              </div>

              <details class="sub-disclosure sim-box">
                <summary>模拟观众事件（抖音 / TikTok / YouTube）</summary>
                <div class="sub-fields sim-fields">
                  <div class="sim-row">
                    <select id="simPlatform" aria-label="模拟平台">
                      <option value="douyin">抖音</option>
                      <option value="tiktok">TikTok</option>
                      <option value="youtube">YouTube</option>
                    </select>
                    <input id="simAuthor" placeholder="用户名" aria-label="模拟用户名" />
                  </div>
                  <div class="sim-row">
                    <input id="simGift" placeholder="礼物名称" aria-label="模拟礼物名称" />
                    <input id="simCount" type="number" min="1" max="999" value="1" class="sim-count" aria-label="模拟礼物数量" />
                  </div>
                  <input id="simText" placeholder="弹幕内容或礼物留言（可选）" aria-label="模拟弹幕内容" />
                  <div class="tool-row">
                    <button type="button" id="simJoin">模拟进房</button>
                    <button type="button" id="simGiftBtn">模拟送礼</button>
                    <button type="button" id="simChat">模拟弹幕</button>
                  </div>
                  <label class="check sim-keep">
                    <input type="checkbox" id="keepEventsOnStart" />
                    <span>开播时保留历史动态（未开播的事件不会触发播报）</span>
                  </label>
                </div>
              </details>
            </section>
          </div>
          <div class="panel-column">
            <section class="bento-cell cell-composer" aria-labelledby="h-composer">
              <div class="cell-top">
                <h2 id="h-composer">插入指令</h2>
                <button id="interrupt" class="cut" disabled>打断播出</button>
              </div>

              <div class="composer-body">
                <div class="composer-bar">
                  <div id="modes" class="segmented" role="group" aria-label="指令模式">
                    <button data-mode="say" aria-pressed="true">直接说话</button>
                    <button data-mode="reply" aria-pressed="false">AI 回复</button>
                    <button data-mode="action" aria-pressed="false">人物动作</button>
                  </div>
                  <span class="char-hint mono" id="charCount">0 / 600</span>
                </div>

                <div class="row wrap-row" id="quickActions" role="group" aria-label="常用动作" hidden>
                  <button type="button" id="restChin" data-action="用一只手轻托脸颊，头微微侧倾，看向镜头" disabled>托腮</button>
                  <button type="button" id="handHeart" data-action="双手在胸前比出爱心，微笑看向镜头" disabled>比心</button>
                  <button type="button" id="brushHair" data-action="抬起一只手，将脸侧的头发轻轻拨到耳后" disabled>撩头发</button>
                  <button type="button" id="wave" data-action="微笑看向镜头，抬起一只手左右挥动两次" disabled>挥手</button>
                  <button type="button" id="nod" data-action="看向镜头，轻轻点头两次" disabled>点头</button>
                  <button type="button" id="readChat" data-action="上身稍稍靠近镜头，视线移向画面下方，停一拍再抬眼" disabled>凑近看弹幕</button>
                  <button type="button" id="coverSmile" data-action="眼睛笑弯，一只手轻遮嘴角，笑过后自然放下" disabled>掩嘴笑</button>
                  <button type="button" id="peaceSign" data-action="抬起一只手，在脸旁比出剪刀手" disabled>比耶</button>
                  <button type="button" id="palmsThanks" data-action="双手在胸前轻轻合十，看向镜头笑着低一下头" disabled>合掌谢礼</button>
                  <button type="button" id="wink" data-action="看向镜头，俏皮地眨一只眼，再轻轻一笑" disabled>眨眼放电</button>
                  <button type="button" id="shyGlance" data-action="低下眼睛抿嘴一笑，停一拍再抬眼看向镜头" disabled>低头浅笑</button>
                  <button type="button" id="frameFace" data-action="双手掌心朝上，在下巴两侧张开成花朵状，歪头微笑" disabled>花式捧脸</button>
                  <button type="button" id="sway" data-action="放松双肩，跟着节拍左右轻晃上身两下" disabled>轻晃跟拍</button>
                  <button type="button" id="fingerHeart" data-action="在脸旁用一只手的拇指和食指交叠比出小爱心，朝镜头轻轻送出" disabled>指尖比心</button>
                  <button type="button" id="blowKiss" data-action="指尖轻触嘴唇，再朝镜头送出一个飞吻" disabled>飞吻</button>
                </div>

                <label class="sr" for="line">播出内容</label>
                <div class="composer-input-wrap">
                  <textarea id="line" rows="5" maxlength="600" placeholder="输入要说的话"></textarea>
                </div>

                <div class="row spread composer-actions">
                  <div class="row">
                    <button id="audition">
                      <svg class="ic" viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M3.5 6.2h2.2l3.1-2.5v8.6l-3.1-2.5H3.5a.8.8 0 0 1-.8-.8V7a.8.8 0 0 1 .8-.8Z" />
                        <path d="M11.3 5.8a3.2 3.2 0 0 1 0 4.4M13 4.2a5.4 5.4 0 0 1 0 7.6" />
                      </svg>
                      <span>本机试听</span>
                    </button>
                    <button id="soundcheck">
                      <svg class="ic" viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M2.5 8h2l1.6-3.8 2.4 7.6 1.8-3.8h3.2" />
                      </svg>
                      <span>舞台试音</span>
                    </button>
                  </div>
                  <div class="row">
                    <kbd class="shortcut-kbd" aria-hidden="true">⌘ ↵</kbd>
                    <button class="primary" id="send" disabled>加入播出</button>
                  </div>
                </div>

                <audio id="audio" controls hidden></audio>
              </div>
            </section>
            <section class="bento-cell" aria-labelledby="h-inbox">
              <div class="cell-top"><h2 id="h-inbox">实时弹幕与礼物队列</h2></div>
              <div id="audienceFeed" class="event-list"><div class="empty-events">等待弹幕或礼物</div></div>
            </section>
          </div>
          <div class="panel-column">
            <section class="bento-cell cell-tools" aria-labelledby="h-tools">
              <div class="cell-top">
                <h2 id="h-tools">音频、参考图与曲库</h2>
              </div>

              <div class="tool-groups">
                <div class="tool-block online-music">
                  <div class="tool-head">
                    <div class="tool-label">在线歌单与点歌</div>
                    <select id="musicProvider" aria-label="音乐平台"><option value="netease">网易云音乐</option><option value="qq">QQ 音乐</option></select>
                  </div>
                  <div class="tool-row">
                    <input id="musicTerm" placeholder="歌名或歌手" aria-label="歌名或歌手" maxlength="100" />
                    <button id="searchMusic">搜歌</button>
                  </div>
                  <div id="musicMatches" hidden><div class="tool-row">
                    <select id="musicResults" class="track-select" aria-label="搜索结果"></select>
                    <button id="requestMusic">点播</button>
                  </div></div>
                  <div id="bgmQueue" class="meta" role="status"></div>
                  <div class="tool-row">
                    <input id="musicPlaylist" placeholder="歌单详情链接或 ID" aria-label="歌单详情链接或 ID" />
                    <button id="importPlaylist">导入歌单</button>
                  </div>
                  <div class="tool-row">
                    <button id="toggleBgm">开启 BGM</button>
                    <button id="nextBgm">下一首</button>
                  </div>
                  <details id="musicAccount" class="sub-disclosure" hidden open>
                    <summary>账号 Cookie</summary>
                    <div class="music-account-fields">
                      <label>uin<input id="musicUin" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" /></label>
                      <label>qqmusic_key<input id="musicKey" type="password" autocomplete="off" spellcheck="false" /></label>
                    </div>
                    <div class="tool-row">
                      <button id="saveMusicCookie">保存 Cookie</button>
                      <button id="clearMusicCookie" hidden>清除 Cookie</button>
                    </div>
                    <span id="musicAccountState" class="meta" role="status"></span>
                  </details>
                </div>

                <div class="tool-block">
                  <div class="tool-head">
                    <div class="tool-label">舞蹈视频</div>
                    <label class="file-button">导入视频<input id="danceImport" type="file" accept=".mp4,.mov,.webm" multiple /></label>
                  </div>
                  <div class="tool-row"><select id="danceSelect" class="track-select" aria-label="选择舞蹈视频"></select></div>
                  <div class="tool-row">
                    <button id="dancePlay" class="primary" disabled>播放舞蹈</button>
                    <button id="danceStop" hidden>返回当前画面</button>
                    <button id="danceRemove" disabled>移除</button>
                  </div>
                  <span id="danceStatus" class="meta" role="status"></span>
                </div>

                <div class="tool-block">
                  <div class="tool-label">实时参考图</div>
                  <div class="tool-row">
                    <select id="refKind" aria-label="参考图用途">
                      <option value="object">手持物</option>
                      <option value="garment">服装</option>
                      <option value="background">背景</option>
                    </select>
                    <label class="file-button">
                      选择参考图
                      <input type="file" id="reference" accept="image/png,image/jpeg,image/webp" />
                    </label>
                    <button id="removeRef">撤下参考图</button>
                  </div>
                </div>

                <div class="tool-block">
                  <div class="tool-head">
                    <div class="tool-label">演唱曲库</div>
                    <span id="trackCount" class="meta mono"></span>
                  </div>
                  <div class="tool-row">
                    <label class="file-button">
                      导入歌曲（多选）
                      <input type="file" id="addTrack" accept="audio/*,.mp3,.wav,.flac,.m4a,.aac,.ogg,.opus,video/mp4" multiple />
                    </label>
                    <label class="file-button">
                      导入文件夹
                      <input type="file" id="addTrackFolder" webkitdirectory multiple />
                    </label>
                  </div>
                  <div class="tool-row">
                    <select id="tracks" aria-label="演唱曲库" class="track-select"></select>
                  </div>
                  <div id="trackImportStatus" class="meta" role="status" hidden></div>
                  <details id="trackImportErrors" class="sub-disclosure" hidden>
                    <summary>查看导入失败的文件</summary>
                    <ul></ul>
                  </details>
                  <div class="tool-row">
                    <button id="playTrack">演唱此首</button>
                    <button id="previewTrack">试听</button>
                    <button id="removeTrack">移除</button>
                    <button id="clearTracks">清空</button>
                  </div>
                  <div class="mixer-row">
                    <label class="mixer-item">
                      <span>演唱音量 <b id="liveSongVolVal" class="mono">95%</b></span>
                      <input id="liveSongVol" type="range" min="0" max="100" value="95" />
                    </label>
                    <label class="mixer-item mixer-sync">
                      <span>同步偏移(ms)</span>
                      <input id="liveSyncOffset" type="number" min="0" max="4000" step="50" value="800" />
                    </label>
                  </div>
                </div>

                <div class="tool-block">
                  <div class="tool-head">
                    <div class="tool-label">背景音乐</div>
                    <span id="bgmCount" class="meta mono"></span>
                  </div>
                  <div class="tool-row">
                    <label class="file-button">
                      导入 BGM
                      <input type="file" id="addBgm" accept="audio/*,.mp3,.wav,.flac,.m4a,.aac,.ogg,.opus" multiple />
                    </label>
                    <label class="file-button">
                      导入文件夹
                      <input type="file" id="addBgmFolder" webkitdirectory multiple />
                    </label>
                  </div>
                  <div class="tool-row">
                    <select id="bgmTracks" aria-label="背景音乐列表" class="track-select"></select>
                  </div>
                  <div id="bgmImportStatus" class="meta" role="status" hidden></div>
                  <details id="bgmImportErrors" class="sub-disclosure" hidden>
                    <summary>查看导入失败的文件</summary>
                    <ul></ul>
                  </details>
                  <div class="tool-row">
                    <button id="previewBgm">试听</button>
                    <button id="removeBgm">移除</button>
                    <button id="clearBgm">清空</button>
                  </div>
                  <div class="mixer-row">
                    <label class="mixer-item">
                      <span>BGM 音量 <b id="liveBgmVolVal" class="mono">25%</b></span>
                      <input id="liveBgmVol" type="range" min="0" max="100" value="25" />
                    </label>
                    <span id="bgmNow" class="meta bgm-now">未播放</span>
                  </div>
                </div>
              </div>
            </section>
          </div>
        </div>
      </section>

<!-- settings-panel -->
    </main>

    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>

    <dialog id="confirm">
      <div class="dialog-head">
        <span class="dialog-icon" aria-hidden="true">
          <svg viewBox="0 0 18 18">
            <circle cx="9" cy="9" r="6.5" />
            <path d="M9 6.2v3.3M9 12.1h.01" />
          </svg>
        </span>
        <h2 id="confirmTitle"></h2>
      </div>
      <p id="confirmDesc"></p>
      <div class="row end dialog-actions">
        <button id="no">取消</button>
        <button id="yes" class="primary">确定</button>
      </div>
    </dialog>

    <script type="module" src="/studio.js"></script>
  </body>
</html>
