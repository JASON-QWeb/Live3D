[package]
name = "avatar3d-live"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "A macOS live studio for interactive avatar speech, audience chat, and stage cues"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream", "http2"] }
security-framework = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
subtle = "2"
url = "2"

[profile.release]
strip = true
